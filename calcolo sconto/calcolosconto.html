<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calcolatore Sconti</title>
    <style>
      /* CSS: Layout a Card */
      body {
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f4f4f9;
        margin: 0;
      }

      .card {
        background: white;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        width: 300px;
        text-align: center;
      }

      input,
      select,
      button {
        width: 100%;
        margin-top: 10px;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
        box-sizing: border-box;
      }

      button {
        background-color: #007bff;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: bold;
        transition: background 0.3s;
      }

      button:hover {
        background-color: #0056b3;
      }

      /* Classi dinamiche richieste */
      .risparmio-alto {
        color: #28a745;
        font-weight: bold;
      }

      .errore {
        color: #dc3545;
        font-weight: bold;
      }

      #risultato {
        margin-top: 20px;
        min-height: 24px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Calcolatore Sconto</h2>

      <label for="prezzo">Prezzo Originale (€)</label>
      <input type="number" id="prezzo" placeholder="Es. 100" step="0.01" />

      <label for="sconto">Seleziona Sconto</label>
      <select id="sconto">
        <option value="10">10%</option>
        <option value="20">20%</option>
        <option value="30">30%</option>
        <option value="50">50%</option>
      </select>

      <button onclick="calcolaSconto()">Calcola Prezzo Finale</button>

      <div id="risultato"></div>
    </div>

    <script>
      function calcolaSconto() {
        // Recupero elementi DOM
        const inputPrezzo = document.getElementById("prezzo");
        const selectSconto = document.getElementById("sconto");
        const divRisultato = document.getElementById("risultato");

        // Conversione valori
        const prezzoOriginale = parseFloat(inputPrezzo.value);
        const percentualeSconto = parseInt(selectSconto.value);

        // Pulizia classi e contenuto precedente
        divRisultato.className = "";
        divRisultato.innerHTML = "";

        // 1. Validazione
        if (isNaN(prezzoOriginale) || prezzoOriginale <= 0) {
          divRisultato.innerText = "Errore: Inserisci un prezzo maggiore di 0.";
          divRisultato.classList.add("errore");
          return;
        }

        // 2. Logica di calcolo
        // Formula: PrezzoFinale = PrezzoOriginale - (PrezzoOriginale * Sconto / 100)
        const importoSconto = (prezzoOriginale * percentualeSconto) / 100;
        const prezzoFinale = prezzoOriginale - importoSconto;

        // 3. Feedback Dinamico
        if (percentualeSconto > 25) {
          divRisultato.classList.add("risparmio-alto");
        }

        // Stampa del risultato (arrotondato a 2 decimali)
        divRisultato.innerHTML = `Prezzo Finale: € ${prezzoFinale.toFixed(
          2
        )} <br> 
                                     (Hai risparmiato € ${importoSconto.toFixed(
                                       2
                                     )})`;
      }
    </script>
  </body>
</html>
