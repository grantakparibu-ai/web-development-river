<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
    CSP: blocca script inline da origini esterne non autorizzate,
    impedisce l'injection di risorse malevole.
    'self' = solo file locali. 'unsafe-inline' necessario per stile
    inline minimo; in prod usare nonce.
  -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
                 script-src 'self';
                 style-src 'self' https://fonts.googleapis.com;
                 font-src https://fonts.gstatic.com;
                 img-src 'none';"
    />

    <meta name="referrer" content="no-referrer" />
    <title>ACCESS // PORTAL</title>

    <!-- Google Font: JetBrains Mono — monospace aggressivo da dev -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/login.css" />
    <script src="js/login.js"></script>
  </head>
  <body>
    <!-- Overlay con scanlines — effetto CRT/terminale -->
    <div class="scanlines" aria-hidden="true"></div>

    <!-- Particelle di sfondo generate via JS -->
    <canvas id="bg-canvas" aria-hidden="true"></canvas>

    <main class="login-wrapper">
      <div class="login-card">
        <!-- Header con glitch sul titolo -->
        <header class="card-header">
          <div class="logo-mark" aria-hidden="true">⬡</div>
          <h1 class="glitch" data-text="ACCESS">ACCESS</h1>
          <p class="subtitle">SISTEMA DI AUTENTICAZIONE SICURA</p>
        </header>

        <!--
        action="#" → nessun submit a server reale.
        novalidate → gestiamo noi la validazione lato JS
        per controllo completo sull'UX e sui messaggi.
        autocomplete="off" sulla form, ma poi abilitiamo
        selettivamente username/password per i password manager.
      -->
        <form
          id="login-form"
          action="#"
          method="post"
          novalidate
          autocomplete="off"
        >
          <div class="field-group">
            <label for="username">UTENTE</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">▸</span>
              <input
                type="text"
                id="username"
                name="username"
                placeholder="username"
                autocomplete="username"
                spellcheck="false"
                maxlength="64"
                required
              />
            </div>
          </div>

          <div class="field-group">
            <label for="password">CHIAVE</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">▸</span>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                autocomplete="current-password"
                maxlength="128"
                required
              />
              <!--
              Toggle visibilità password: accessibilità + UX.
              aria-label cambia dinamicamente via JS.
            -->
              <button type="button" id="toggle-pw" aria-label="Mostra password">
                <span id="eye-icon">👁</span>
              </button>
            </div>
          </div>

          <!--
          Checkbox "Resta collegato":
          SE selezionata → cookie con expires = +7 giorni
          SE non selezionata → session cookie (nessun expires),
          scade alla chiusura del browser.
        -->
          <div class="remember-row">
            <label class="checkbox-label">
              <input type="checkbox" id="remember-me" name="remember" />
              <span class="checkmark" aria-hidden="true"></span>
              RESTA COLLEGATO
            </label>
            <span class="remember-hint">7gg · session</span>
          </div>

          <!--
          #message-box: area ARIA live per accessibilità.
          aria-live="assertive" → screen reader annuncia subito
          qualsiasi errore o successo senza aspettare il focus.
        -->
          <div
            id="message-box"
            role="alert"
            aria-live="assertive"
            aria-atomic="true"
          ></div>

          <!-- Barra progresso lockout — visibile solo durante il cooldown -->
          <div id="lockout-bar-wrap" aria-hidden="true">
            <div id="lockout-bar"></div>
            <span id="lockout-timer"></span>
          </div>

          <button type="submit" id="submit-btn">
            <span id="btn-text">ACCEDI</span>
            <span class="btn-arrow" aria-hidden="true">→</span>
          </button>

          <!-- Tentativo counter — feedback visivo senza essere verbosi -->
          <p id="attempts-counter" aria-live="polite"></p>
        </form>
      </div>

      <footer class="login-footer">
        <span>SEC-LVL: MAX</span>
        <span id="clock"></span>
        <span>v2.0.1</span>
      </footer>
    </main>

    <script src="js/login.js"></script>
  </body>
</html>
