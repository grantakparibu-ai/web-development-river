<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Accedi — TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>

  <div class="bg-grid"></div>

  <main class="container">

    <div class="brand">
      <span class="brand-icon">◈</span>
      <span class="brand-name">TaskFlow</span>
    </div>

    <div class="card" id="login-card">
      <h1 class="card-title">Bentornato.</h1>
      <p class="card-subtitle">Accedi per gestire le tue attività.</p>

      <div id="message-box" class="message-box hidden"></div>

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="admin" autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
          <button class="eye-btn" id="toggle-password" type="button" aria-label="Mostra password">
            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="password-hint" id="password-hint"></div>
      </div>

      <div class="field-row">
        <label class="checkbox-label">
          <input type="checkbox" id="remember-me" />
          <span class="checkmark"></span>
          Resta collegato per 7 giorni
        </label>
      </div>

      <button class="btn-primary" id="login-btn">
        <span>Accedi</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>

      <p class="hint-text">Credenziali demo: <code>admin</code> / <code>Admin123!</code></p>
    </div>

  </main>

  <script src="js/login.js"></script>
</body>
</html>
