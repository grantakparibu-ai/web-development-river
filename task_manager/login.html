<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>ACCESS // PORTAL</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/login.css" />
    <!--
      NOTA: lo script è caricato UNA SOLA VOLTA, in fondo al body.
      Caricarlo qui nell'head E in fondo causerebbe doppia esecuzione
      di tutto il codice: doppi event listener, canvas doppio, ecc.
    -->
  </head>
  <body>

    <!-- Overlay scanlines — effetto CRT/terminale -->
    <div class="scanlines" aria-hidden="true"></div>

    <!-- Canvas particelle di sfondo (generato via JS) -->
    <canvas id="bg-canvas" aria-hidden="true"></canvas>

    <main class="login-wrapper">
      <div class="login-card">

        <header class="card-header">
          <div class="logo-mark" aria-hidden="true">⬡</div>
          <h1 class="glitch" data-text="ACCESS">ACCESS</h1>
          <p class="subtitle">SISTEMA DI AUTENTICAZIONE SICURA</p>
        </header>

        <!--
          action="#" → nessun submit a server reale.
          novalidate → gestiamo noi la validazione in JS.
          autocomplete="off" sulla form, abilitato selettivamente
          sugli input per i password manager.
        -->
        <form
          id="login-form"
          action="#"
          method="post"
          novalidate
          autocomplete="off"
        >

          <div class="field-group">
            <label for="username">UTENTE</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">▸</span>
              <input
                type="text"
                id="username"
                name="username"
                placeholder="username"
                autocomplete="username"
                spellcheck="false"
                maxlength="64"
                required
              />
            </div>
          </div>

          <div class="field-group">
            <label for="password">CHIAVE</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">▸</span>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                autocomplete="current-password"
                maxlength="128"
                required
              />
              <!--
                Toggle visibilità password.
                JS alterna passwordEl.type tra "password" e "text".
              -->
              <button type="button" id="toggle-pw" aria-label="Mostra password">
                <span id="eye-icon">👁</span>
              </button>
            </div>
          </div>

          <!--
            Checkbox "Resta collegato":
            selezionata  → Expires +7 giorni su tutti i cookie
            deselezionata → session cookie (scade alla chiusura browser)
          -->
          <div class="remember-row">
            <label class="checkbox-label">
              <input type="checkbox" id="remember-me" name="remember" />
              <span class="checkmark" aria-hidden="true"></span>
              RESTA COLLEGATO
            </label>
            <span class="remember-hint">7gg · session</span>
          </div>

          <!--
            Message box ARIA live: annunciato subito dagli screen reader
            senza aspettare il focus (aria-live="assertive").
          -->
          <div
            id="message-box"
            role="alert"
            aria-live="assertive"
            aria-atomic="true"
          ></div>

          <!-- Barra progress lockout — visibile solo durante il cooldown -->
          <div id="lockout-bar-wrap" aria-hidden="true">
            <div id="lockout-bar"></div>
            <span id="lockout-timer"></span>
          </div>

          <button type="submit" id="submit-btn">
            <span id="btn-text">ACCEDI</span>
            <span class="btn-arrow" aria-hidden="true">→</span>
          </button>

          <!-- Tentativo counter — feedback visivo tentativi rimasti -->
          <p id="attempts-counter" aria-live="polite"></p>

        </form>
      </div>

      <footer class="login-footer">
        <span>SEC-LVL: MAX</span>
        <span id="clock"></span>
        <span>v2.1.0</span>
      </footer>
    </main>

    <!--
      Script in fondo al body (UNA SOLA VOLTA).
      Tutto il codice è dentro DOMContentLoaded → nessun problema di timing.
    -->
    <script src="js/login.js"></script>
  </body>
</html>
