<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TaskFlow — Le mie attività</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css" />
</head>
<body>

  <!-- Schermata di accesso negato (hidden di default) -->
  <div id="access-denied" class="access-denied hidden">
    <span class="ad-icon">⊘</span>
    <h2>Accesso negato</h2>
    <p>Reindirizzamento al login...</p>
  </div>

  <!-- App principale -->
  <div id="app">

    <!-- ── Sidebar / Header ── -->
    <header class="topbar">
      <div class="topbar-brand">
        <span class="brand-icon">◈</span>
        <span class="brand-name">TaskFlow</span>
      </div>

      <nav class="topbar-nav">
        <a href="index.html" class="nav-link active">Task</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
      </nav>

      <div class="topbar-right">
        <div class="session-timer" id="session-timer">⏱ --:--</div>
        <div class="user-badge" id="user-badge">···</div>
        <button class="btn-logout" id="logout-btn">Esci →</button>
      </div>
    </header>

    <!-- ── Contenuto principale ── -->
    <main class="main">

      <!-- Colonna sinistra: form di aggiunta ── -->
      <section class="panel panel-add">
        <h2 class="panel-title">Nuovo task</h2>

        <div id="error-box" class="error-box hidden"></div>

        <div class="field">
          <label for="task-title">Titolo</label>
          <input type="text" id="task-title" placeholder="Cosa devi fare?" maxlength="80" />
        </div>

        <div class="field">
          <label for="task-due">Scadenza</label>
          <input type="date" id="task-due" />
        </div>

        <div class="field">
          <label for="task-status">Stato iniziale</label>
          <select id="task-status">
            <option value="todo">Da fare</option>
            <option value="doing">In corso</option>
            <option value="done">Completato</option>
          </select>
        </div>

        <button class="btn-add" id="add-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Aggiungi task
        </button>

        <!-- ── Contatore ── -->
        <div class="task-counter">
          <span id="count-total">0</span> task totali
          <span class="counter-dots">·</span>
          <span id="count-done" class="done-count">0</span> completati
        </div>
      </section>

      <!-- Colonna destra: lista task ── -->
      <section class="panel panel-list">

        <!-- Toolbar: filtri + ordinamento + vista ── -->
        <div class="toolbar">
          <div class="toolbar-left">
            <button class="filter-btn active" data-filter="all">Tutti</button>
            <button class="filter-btn" data-filter="todo">Da fare</button>
            <button class="filter-btn" data-filter="doing">In corso</button>
            <button class="filter-btn" data-filter="done">Completati</button>
          </div>
          <div class="toolbar-right">
            <select id="sort-select" class="sort-select">
              <option value="newest">Più recenti</option>
              <option value="oldest">Più vecchi</option>
              <option value="due">Per scadenza</option>
              <option value="status">Per stato</option>
            </select>
            <div class="view-toggle">
              <button class="view-btn active" id="view-list" title="Vista lista">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
              </button>
              <button class="view-btn" id="view-kanban" title="Vista kanban">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="12" rx="1"/></svg>
              </button>
            </div>
          </div>
        </div>

        <!-- Contenitore task (lista o kanban) ── -->
        <div id="task-container"></div>

        <!-- Stato vuoto ── -->
        <div id="empty-state" class="empty-state hidden">
          <span class="empty-icon">○</span>
          <p>Nessun task qui.<br>Aggiungine uno!</p>
        </div>

      </section>
    </main>
  </div>

  <script src="js/index.js"></script>
</body>
</html>
