<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-wrapper">
      <div class="card">

        <!-- ===== INTESTAZIONE ===== -->
        <div class="card-header">
          <div class="header-icon">✦</div>
          <h1>Le mie attività</h1>
          <!--
            taskCount: aggiornato da JS leggendo tasks.length,
            NON contando i <li> del DOM. Fonte di verità = i dati.
          -->
          <p id="taskCount" class="task-count">0 task</p>

          <!--
            Lato destro dell'header:
            - saluto personalizzato (popolato da JS con il cookie current_user)
            - session timer (countdown dinamico)
            - bottone logout (cancella i cookie e torna al login)
          -->
          <div class="header-right">
            <span id="user-greeting" class="user-greeting"></span>
            <div id="session-timer" class="session-timer"></div>
            <button id="logout-btn" class="btn-logout">↩ Logout</button>
          </div>
        </div>

        <!-- ===== FORM DI INPUT ===== -->
        <div class="input-section">
          <div class="input-row">
            <input
              type="text"
              id="taskInput"
              class="input-text"
              placeholder="Nome del task..."
              autocomplete="off"
            />
            <input type="date" id="dateInput" class="input-date" />
          </div>
          <button id="addBtn" class="btn btn-primary">
            <span class="btn-icon">+</span>
            Aggiungi task
          </button>
        </div>

        <!-- Contenitore errori (popolato da JS via createElement) -->
        <div id="errorContainer" class="error-container"></div>

        <!-- ===== BARRA CONTROLLI ===== -->
        <!--
          Visibile solo quando ci sono task.
          In vista Kanban, il blocco #listControls (filtro/ordine)
          viene nascosto da JS perché le colonne già organizzano per stato.
        -->
        <div class="controls-bar hidden" id="controlsBar">

          <div class="controls-left" id="listControls">
            <div class="controls-group">
              <label for="filterSelect" class="controls-label">Mostra</label>
              <select id="filterSelect" class="controls-select">
                <option value="all">Tutti</option>
                <option value="todo">Da fare</option>
                <option value="doing">In corso</option>
                <option value="done">Completati</option>
              </select>
            </div>
            <div class="controls-group">
              <label for="sortSelect" class="controls-label">Ordina</label>
              <select id="sortSelect" class="controls-select">
                <option value="none">—</option>
                <option value="date">Per data</option>
                <option value="status">Per stato</option>
              </select>
            </div>
          </div>

          <!--
            Layout Switcher: cambia solo la visualizzazione,
            non i dati. Il bottone attivo ha classe .active.
            JS aggiorna questa classe al click.
          -->
          <div class="layout-switcher">
            <button id="btnList" class="btn-layout active" title="Vista Lista">
              ☰ Lista
            </button>
            <button id="btnKanban" class="btn-layout" title="Vista Kanban">
              ⊞ Kanban
            </button>
          </div>
        </div>

        <!--
          ===== CONTENITORE PRINCIPALE DI RENDERING =====
          render() svuota questo div (innerHTML = '')
          e lo ricrea da zero, sia in lista che in kanban.
          L'HTML interno non va mai scritto a mano.
        -->
        <div id="mainContainer"></div>

      </div>
    </div>

    <!--
      Script in fondo al body: il DOM è già costruito quando
      il JS viene eseguito → nessun bisogno di defer.
      La guardia accesso (getCookie) e tutto il resto
      sono dentro DOMContentLoaded in script.js.
    -->
    <script src="js/script.js"></script>
  </body>
</html>
